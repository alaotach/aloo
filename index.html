<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Is Aloo GAY?</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        body {
            overflow: hidden;
        }

        img {
            height: 100vh;
            width: 100vw;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
    </style>

    <script>
        // Add your two URLs here
        const links = [
            "https://www.indianhealthyrecipes.com/potato-recipes-aloo-recipes/",
            "https://gayhub.com"
        ];

        // Choose randomly
        const chosen = links[Math.floor(Math.random() * links.length)];

        // When image is clicked, redirect
        window.onload = () => {
            document.getElementById("alooImage").onclick = () => {
                window.location.href = chosen;
            };
        };
    </script>
</head>
<body>
    <img id="alooImage" src="aloo.jpg" alt="aloo khalo" />
</body>
</html>
